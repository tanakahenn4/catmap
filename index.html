<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#05080b">
  <title>EARTH SPOT CAMERA - NO 3D BACKGROUND TEST</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f8fb;
      --muted: rgba(235, 244, 249, 0.7);
      --glass: rgba(8, 13, 17, 0.7);
      --glass-strong: rgba(8, 13, 17, 0.9);
      --line: rgba(255, 255, 255, 0.15);
      --accent: #9df8d3;
      --accent-strong: #42e5a5;
      --danger: #ff9f9f;
      --shadow: 0 12px 38px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #05080b;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    #app,
    #map-shell,
    gmp-map-3d {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #app {
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 40%, rgba(53, 91, 96, 0.24), transparent 42%),
        #05080b;
    }

    #map-shell {
      z-index: 0;
      touch-action: none;
      transition: opacity 520ms ease;
    }

    #map-shell.is-rendering-paused {
      opacity: 0;
      pointer-events: none;
    }

    #street-view-shell {
      position: absolute;
      z-index: 6;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05080b;
      opacity: 0;
      transform: scale(1.018);
      transition: opacity 520ms ease, transform 900ms cubic-bezier(0.2, 0.7, 0.2, 1);
      pointer-events: none;
    }

    #street-view-shell.is-active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    #street-view {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .street-view-toolbar {
      position: absolute;
      z-index: 20;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 9px;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
    }

    body.spot-mode .street-view-toolbar {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .street-view-back,
    .street-view-caption {
      border: 1px solid var(--line);
      background: var(--glass-strong);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px) saturate(125%);
      -webkit-backdrop-filter: blur(16px) saturate(125%);
    }

    .street-view-back {
      width: 44px;
      min-width: 44px !important;
      height: 44px !important;
      padding: 0 !important;
      border-radius: 15px;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }

    .street-view-caption {
      min-width: 0;
      max-width: min(70vw, 540px);
      min-height: 44px;
      display: grid;
      align-content: center;
      gap: 2px;
      padding: 6px 13px;
      border-radius: 15px;
    }

    .street-view-caption strong,
    .street-view-caption span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .street-view-caption strong {
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    .street-view-caption span {
      color: var(--muted);
      font-size: 10px;
    }

    .street-view-loading {
      position: absolute;
      z-index: 8;
      top: calc(max(12px, env(safe-area-inset-top)) + 58px);
      left: 50%;
      max-width: min(86vw, 420px);
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--glass-strong);
      box-shadow: var(--shadow);
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      opacity: 0;
      transform: translate(-50%, 8px);
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
    }

    body.spot-mode:not(.street-view-ready) .street-view-loading {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    body.spot-mode .topbar,
    body.spot-mode .sensor-pill,
    body.spot-mode .reticle,
    body.spot-mode .hint,
    body.spot-mode .dock {
      opacity: 0;
      pointer-events: none;
    }

    #gyro-button,
    #calibrate-button,
    #orbit-button {
      display: none;
    }

    /* Screen-recording view: keep the map and Street View free of app guidance. */
    .street-view-caption,
    .street-view-loading,
    .sensor-pill,
    .hint,
    .dock {
      display: none !important;
    }

    .topbar {
      position: absolute;
      z-index: 10;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      display: grid;
      grid-template-columns: minmax(180px, 560px) auto;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .brand,
    .search,
    .camera-readout,
    .dock,
    .sensor-pill,
    .hint {
      border: 1px solid var(--line);
      background: var(--glass);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px) saturate(125%);
      -webkit-backdrop-filter: blur(16px) saturate(125%);
    }

    .brand {
      display: none !important;
    }

    .brand-mark {
      width: 12px;
      height: 12px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(157, 248, 211, 0.8), inset 0 0 5px rgba(157, 248, 211, 0.5);
    }

    .brand-copy {
      display: grid;
      line-height: 1;
    }

    .brand-copy strong {
      font-size: 12px;
      letter-spacing: 0.16em;
    }

    .brand-copy small {
      margin-top: 4px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.09em;
    }

    .search {
      min-width: 0;
      height: 46px;
      display: flex;
      align-items: center;
      padding: 4px;
      border-radius: 16px;
      pointer-events: auto;
    }

    .search input {
      min-width: 0;
      flex: 1;
      height: 36px;
      padding: 0 12px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-size: 14px;
    }

    .search input::placeholder {
      color: rgba(235, 244, 249, 0.55);
    }

    .search button,
    .icon-button,
    .clean-exit {
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
    }

    .search button {
      width: 38px;
      height: 36px;
      padding: 0;
      border-radius: 12px;
      font-size: 17px;
    }

    .camera-readout {
      min-height: 44px;
      display: grid;
      grid-template-columns: repeat(2, auto);
      align-content: center;
      gap: 2px 10px;
      padding: 6px 12px;
      border-radius: 15px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .camera-readout span {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.08em;
    }

    .camera-readout strong {
      font-size: 11px;
      font-weight: 600;
    }

    .sensor-pill {
      position: absolute;
      z-index: 10;
      top: calc(max(12px, env(safe-area-inset-top)) + 58px);
      left: 50%;
      min-height: 28px;
      max-width: min(86vw, 520px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 5px 11px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.03em;
      transform: translateX(-50%);
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
    }

    .sensor-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #9aa5ab;
      box-shadow: 0 0 0 3px rgba(154, 165, 171, 0.14);
    }

    .sensor-pill[data-tone="active"] .sensor-dot {
      background: var(--accent-strong);
      box-shadow: 0 0 0 3px rgba(66, 229, 165, 0.18), 0 0 14px rgba(66, 229, 165, 0.75);
    }

    .sensor-pill[data-tone="warn"] .sensor-dot {
      background: #ffd084;
      box-shadow: 0 0 0 3px rgba(255, 208, 132, 0.17);
    }

    .sensor-pill[data-tone="error"] .sensor-dot {
      background: var(--danger);
      box-shadow: 0 0 0 3px rgba(255, 159, 159, 0.16);
    }

    .reticle {
      position: absolute;
      z-index: 5;
      top: 50%;
      left: 50%;
      width: 34px;
      height: 34px;
      opacity: 0.7;
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .reticle::before,
    .reticle::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 7px rgba(0, 0, 0, 0.75);
    }

    .reticle::before {
      top: 16px;
      left: 0;
      width: 34px;
      height: 1px;
    }

    .reticle::after {
      top: 0;
      left: 16px;
      width: 1px;
      height: 34px;
    }

    .hint {
      position: absolute;
      z-index: 8;
      left: 50%;
      bottom: calc(max(14px, env(safe-area-inset-bottom)) + 82px);
      max-width: min(90vw, 520px);
      padding: 7px 12px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 10px;
      text-align: center;
      transform: translateX(-50%);
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .dock {
      position: absolute;
      z-index: 10;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      width: min(calc(100% - 24px), 680px);
      display: grid;
      grid-template-columns: repeat(4, minmax(50px, 1fr));
      gap: 4px;
      padding: 5px;
      border-radius: 20px;
      transform: translateX(-50%);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .icon-button {
      min-width: 0;
      height: 58px;
      grid-template-rows: 24px 14px;
      gap: 2px;
      padding: 5px 2px;
      border-color: transparent;
      border-radius: 15px;
    }

    .icon-button .icon {
      font-size: 19px;
      line-height: 1;
    }

    .icon-button .label {
      overflow: hidden;
      color: var(--muted);
      font-size: 9px;
      line-height: 1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    button:active {
      transform: scale(0.96);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .icon-button[aria-pressed="true"] {
      border-color: rgba(157, 248, 211, 0.4);
      background: rgba(66, 229, 165, 0.16);
    }

    .icon-button[aria-pressed="true"] .label {
      color: var(--accent);
    }

    .icon-button:disabled {
      cursor: default;
      opacity: 0.35;
    }

    .fullscreen-mini {
      position: absolute;
      z-index: 25;
      right: max(10px, env(safe-area-inset-right));
      bottom: max(10px, env(safe-area-inset-bottom));
      width: 42px;
      min-width: 42px;
      height: 42px;
      grid-template-rows: 1fr;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--glass-strong);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px) saturate(125%);
      -webkit-backdrop-filter: blur(14px) saturate(125%);
      opacity: 0.74;
      pointer-events: auto;
    }

    .fullscreen-mini .label {
      display: none;
    }

    .toast {
      position: absolute;
      z-index: 30;
      left: 50%;
      bottom: calc(max(14px, env(safe-area-inset-bottom)) + 90px);
      max-width: min(88vw, 480px);
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--glass-strong);
      box-shadow: var(--shadow);
      color: #fff;
      font-size: 12px;
      text-align: center;
      opacity: 0;
      transform: translate(-50%, 10px);
      transition: opacity 160ms ease, transform 160ms ease;
      pointer-events: none;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .error-panel {
      position: absolute;
      z-index: 40;
      top: 50%;
      left: 50%;
      width: min(calc(100% - 32px), 460px);
      padding: 20px;
      border: 1px solid rgba(255, 159, 159, 0.35);
      border-radius: 20px;
      background: var(--glass-strong);
      box-shadow: var(--shadow);
      text-align: center;
      transform: translate(-50%, -50%);
    }

    .error-panel h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .error-panel p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .clean-exit {
      position: absolute;
      z-index: 25;
      top: max(10px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      width: 40px;
      height: 40px;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    body.clean-mode .topbar,
    body.clean-mode .sensor-pill,
    body.clean-mode .hint,
    body.clean-mode .dock,
    body.clean-mode .street-view-toolbar {
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
    }

    body.clean-mode .reticle {
      opacity: 0;
    }

    body.clean-mode .clean-exit {
      opacity: 0.36;
      pointer-events: auto;
    }

    body.clean-mode .toast {
      bottom: max(18px, env(safe-area-inset-bottom));
    }

    @media (hover: hover) {
      .search button:hover,
      .icon-button:hover,
      .clean-exit:hover {
        background: rgba(255, 255, 255, 0.15);
      }
    }

    @media (max-width: 760px) {
      .topbar {
        grid-template-columns: 1fr auto;
      }

      .brand {
        display: none;
      }

      .camera-readout {
        padding-inline: 10px;
      }

      .dock {
        grid-template-columns: repeat(4, minmax(42px, 1fr));
      }

      .icon-button {
        height: 56px;
      }
    }

    @media (max-width: 470px) {
      .topbar {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 6px;
      }

      .search {
        height: 43px;
      }

      .search input {
        width: 100%;
        height: 33px;
        padding-inline: 9px;
        font-size: 13px;
      }

      .search button {
        width: 34px;
        height: 33px;
      }

      .camera-readout {
        min-height: 43px;
        grid-template-columns: 1fr;
        gap: 1px;
      }

      .camera-readout span:nth-of-type(2),
      .camera-readout strong:nth-of-type(2) {
        display: none;
      }

      .sensor-pill {
        top: calc(max(12px, env(safe-area-inset-top)) + 53px);
        font-size: 10px;
      }

      .dock {
        width: calc(100% - 16px);
        bottom: max(8px, env(safe-area-inset-bottom));
        gap: 1px;
        padding: 4px;
        border-radius: 18px;
      }

      .icon-button {
        height: 53px;
        border-radius: 13px;
      }

      .icon-button .icon {
        font-size: 17px;
      }

      .icon-button .label {
        font-size: 8px;
      }

      .hint {
        bottom: calc(max(8px, env(safe-area-inset-bottom)) + 70px);
      }

      .street-view-toolbar {
        gap: 6px;
      }

      .street-view-back {
        min-width: 88px;
        height: 42px;
        padding-inline: 10px;
        font-size: 12px;
      }

      .street-view-caption {
        min-height: 42px;
        padding-inline: 10px;
      }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      .topbar {
        left: max(8px, env(safe-area-inset-left));
        right: auto;
        width: min(54vw, 520px);
      }

      .camera-readout,
      .sensor-pill,
      .hint {
        display: none;
      }

      .dock {
        left: auto;
        right: max(8px, env(safe-area-inset-right));
        bottom: 50%;
        width: 58px;
        grid-template-columns: 1fr;
        transform: translateY(50%);
      }

      .icon-button {
        height: 43px;
        grid-template-rows: 1fr;
      }

      .icon-button .label {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main id="app">
    <div id="map-shell" aria-label="Google 3D map"></div>
    <div id="street-view-shell" aria-hidden="true">
      <div id="street-view" aria-label="ストリートビュー"></div>
    </div>

    <div id="street-view-toolbar" class="street-view-toolbar">
      <button id="street-view-back" class="street-view-back" type="button" aria-label="地図を再読み込み" title="地図を再読み込み">↻</button>
      <div class="street-view-caption" role="status" aria-live="polite">
        <strong id="street-view-title">スポット</strong>
        <span id="street-view-status">ストリートビューを準備しています…</span>
      </div>
    </div>
    <div class="street-view-loading">3D地図を終了してストリートビューを準備しています…</div>

    <div class="topbar">
      <div class="brand" aria-hidden="true">
        <span class="brand-mark"></span>
        <span class="brand-copy">
          <strong>EARTH SPOT</strong>
          <small>NO 3D BACKGROUND TEST</small>
        </span>
      </div>

      <form id="search-form" class="search" role="search">
        <input id="search-input" type="search" enterkeyhint="search" autocomplete="off"
          placeholder="場所名・住所・緯度,経度" aria-label="場所を検索">
        <button type="submit" aria-label="検索">⌕</button>
      </form>

      <div class="camera-readout" aria-live="polite">
        <span>方角</span><span>高度</span>
        <strong id="heading-value">000°</strong><strong id="range-value">—</strong>
      </div>
    </div>

    <div id="sensor-pill" class="sensor-pill" data-tone="idle" role="status" aria-live="polite">
      <span class="sensor-dot"></span>
      <span id="sensor-text">地図を準備しています…</span>
    </div>

    <div class="reticle" aria-hidden="true"></div>
    <div id="gesture-hint" class="hint">1本指で移動・2本指で角度・ピンチで高度を調整</div>

    <nav class="dock" aria-label="カメラ操作">
      <button id="gyro-button" class="icon-button" type="button" aria-pressed="false">
        <span class="icon">◉</span><span class="label">ジャイロ</span>
      </button>
      <button id="calibrate-button" class="icon-button" type="button" disabled>
        <span class="icon">⊕</span><span class="label">基準</span>
      </button>
      <button id="orbit-button" class="icon-button" type="button" aria-pressed="false">
        <span class="icon">↻</span><span class="label">旋回</span>
      </button>
      <button id="locate-button" class="icon-button" type="button">
        <span class="icon">⌖</span><span class="label">現在地</span>
      </button>
      <button id="share-button" class="icon-button" type="button">
        <span class="icon">↗</span><span class="label">リンク</span>
      </button>
      <button id="clean-button" class="icon-button" type="button" aria-pressed="false">
        <span class="icon">●</span><span class="label">収録</span>
      </button>
    </nav>

    <button id="fullscreen-button" class="icon-button fullscreen-mini" type="button" aria-label="全画面表示を切り替え" aria-pressed="false">
      <span class="icon" aria-hidden="true">⛶</span><span class="label">全画面</span>
    </button>

    <button id="clean-exit" class="clean-exit" type="button" aria-label="収録モードを終了">×</button>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <section id="error-panel" class="error-panel" hidden>
      <h2>3D地図を表示できません</h2>
      <p id="error-message"></p>
    </section>
  </main>

  <script>
    const API_KEY = "AIzaSyB5kbAl74HZzz9TbQSNakdeG9XMc-8EVeI";
    const STORAGE_KEY = "earth_spot_camera_v1";
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyC_HyYwQMwfODX15o5HXjw7aYSPnuaFTOg",
      authDomain: "nekocatsmap.firebaseapp.com",
      projectId: "nekocatsmap",
      storageBucket: "nekocatsmap.firebasestorage.app",
      messagingSenderId: "247582443573",
      appId: "1:247582443573:web:078b7acb7e0bd7ca81897c"
    };
    const DEFAULT_CAMERA = {
      center: { lat: 35.65858, lng: 139.74543, altitude: 40 },
      range: 1250,
      heading: 18,
      tilt: 68,
      roll: 0
    };
    const OVERVIEW_MAP_MODE = "SATELLITE";

    const elements = {
      mapShell: document.getElementById("map-shell"),
      streetViewShell: document.getElementById("street-view-shell"),
      streetView: document.getElementById("street-view"),
      streetViewToolbar: document.getElementById("street-view-toolbar"),
      streetViewBack: document.getElementById("street-view-back"),
      streetViewTitle: document.getElementById("street-view-title"),
      streetViewStatus: document.getElementById("street-view-status"),
      searchForm: document.getElementById("search-form"),
      searchInput: document.getElementById("search-input"),
      headingValue: document.getElementById("heading-value"),
      rangeValue: document.getElementById("range-value"),
      sensorPill: document.getElementById("sensor-pill"),
      sensorText: document.getElementById("sensor-text"),
      gyroButton: document.getElementById("gyro-button"),
      calibrateButton: document.getElementById("calibrate-button"),
      orbitButton: document.getElementById("orbit-button"),
      locateButton: document.getElementById("locate-button"),
      shareButton: document.getElementById("share-button"),
      cleanButton: document.getElementById("clean-button"),
      fullscreenButton: document.getElementById("fullscreen-button"),
      cleanExit: document.getElementById("clean-exit"),
      toast: document.getElementById("toast"),
      errorPanel: document.getElementById("error-panel"),
      errorMessage: document.getElementById("error-message")
    };

    let map;
    let geocoder;
    let panorama;
    let streetViewService;
    let Marker3DInteractiveElementClass;
    let PinElementClass;
    let mapMarkers = [];
    let toastTimer;
    let orbiting = false;
    let saveTimer;

    const viewState = {
      mode: "map",
      token: 0,
      returnCamera: null,
      resumeMapGyro: false,
      selectedSpot: null,
      mapRenderingPaused: false
    };

    const resolvedPanoCache = new Map();

    const gyro = {
      active: false,
      sample: null,
      reference: null,
      calibrationSamples: [],
      targetHeading: DEFAULT_CAMERA.heading,
      targetTilt: DEFAULT_CAMERA.tilt,
      userInteracting: false,
      frameId: 0,
      lastFrameTime: 0,
      waitingTimer: 0
    };

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function normalize360(value) {
      return ((value % 360) + 360) % 360;
    }

    function shortestAngle(value) {
      return ((value + 540) % 360) - 180;
    }

    function finiteNumber(value, fallback) {
      const number = Number(value);
      return Number.isFinite(number) ? number : fallback;
    }

    function currentCamera() {
      if (!map) return structuredClone(DEFAULT_CAMERA);
      const center = map.center || DEFAULT_CAMERA.center;
      return {
        center: {
          lat: finiteNumber(center.lat ?? center.latitude, DEFAULT_CAMERA.center.lat),
          lng: finiteNumber(center.lng ?? center.longitude, DEFAULT_CAMERA.center.lng),
          altitude: finiteNumber(center.altitude, 0)
        },
        range: finiteNumber(map.range, DEFAULT_CAMERA.range),
        heading: normalize360(finiteNumber(map.heading, DEFAULT_CAMERA.heading)),
        tilt: clamp(finiteNumber(map.tilt, DEFAULT_CAMERA.tilt), 0, 90),
        roll: finiteNumber(map.roll, 0)
      };
    }

    function cameraFromUrlOrStorage() {
      const params = new URLSearchParams(location.search);
      const hasUrlCamera = params.has("lat") && params.has("lng");
      let stored = null;

      try {
        stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      } catch (error) {
        console.warn("保存済みカメラ情報を読み込めませんでした", error);
      }

      const source = hasUrlCamera ? {
        center: {
          lat: params.get("lat"),
          lng: params.get("lng"),
          altitude: params.get("alt")
        },
        range: params.get("range"),
        heading: params.get("heading"),
        tilt: params.get("tilt")
      } : stored;

      if (!source) return structuredClone(DEFAULT_CAMERA);

      const camera = {
        center: {
          lat: finiteNumber(source.center?.lat, DEFAULT_CAMERA.center.lat),
          lng: finiteNumber(source.center?.lng, DEFAULT_CAMERA.center.lng),
          altitude: finiteNumber(source.center?.altitude, DEFAULT_CAMERA.center.altitude)
        },
        range: clamp(finiteNumber(source.range, DEFAULT_CAMERA.range), 30, 20000000),
        heading: normalize360(finiteNumber(source.heading, DEFAULT_CAMERA.heading)),
        tilt: clamp(finiteNumber(source.tilt, DEFAULT_CAMERA.tilt), 0, 90),
        roll: 0
      };

      if (Math.abs(camera.center.lat) > 90 || Math.abs(camera.center.lng) > 180) {
        return structuredClone(DEFAULT_CAMERA);
      }
      return camera;
    }

    function updateReadout() {
      if (!map) return;
      const camera = currentCamera();
      elements.headingValue.textContent = `${String(Math.round(camera.heading)).padStart(3, "0")}°`;
      elements.rangeValue.textContent = camera.range >= 1000
        ? `${(camera.range / 1000).toFixed(camera.range >= 10000 ? 0 : 1)} km`
        : `${Math.round(camera.range)} m`;
    }

    function scheduleSaveCamera() {
      if (viewState.mode !== "map") return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        if (viewState.mode !== "map" || !map || viewState.mapRenderingPaused) return;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(currentCamera()));
        } catch (error) {
          console.warn("カメラ情報を保存できませんでした", error);
        }
      }, 250);
    }

    function setSensorStatus(message, tone = "idle") {
      elements.sensorText.textContent = message;
      elements.sensorPill.dataset.tone = tone;
    }

    function showToast(message, duration = 2200) {
      clearTimeout(toastTimer);
      elements.toast.textContent = message;
      elements.toast.classList.add("is-visible");
      toastTimer = setTimeout(() => elements.toast.classList.remove("is-visible"), duration);
    }

    function showMapError(message) {
      elements.errorMessage.textContent = message;
      elements.errorPanel.hidden = false;
      setSensorStatus("地図の読み込みに失敗しました", "error");
    }

    function parseCoordinates(value) {
      const match = value.trim().match(/^\s*(-?\d+(?:\.\d+)?)\s*[,、\s]\s*(-?\d+(?:\.\d+)?)\s*$/);
      if (!match) return null;
      const lat = Number(match[1]);
      const lng = Number(match[2]);
      if (!Number.isFinite(lat) || !Number.isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) {
        return null;
      }
      return { lat, lng };
    }

    function flyToLocation(position, range = 1200) {
      if (!map) return;
      const wasGyroActive = gyro.active;
      if (wasGyroActive) gyro.userInteracting = true;
      map.stopCameraAnimation();
      map.flyCameraTo({
        endCamera: {
          center: { lat: position.lat, lng: position.lng, altitude: 20 },
          range,
          heading: currentCamera().heading,
          tilt: 68,
          roll: 0
        },
        durationMillis: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 2200
      });

      if (wasGyroActive) {
        setTimeout(() => {
          gyro.userInteracting = false;
          beginGyroCalibration(false);
        }, 2350);
      }
    }

    async function searchLocation(event) {
      event.preventDefault();
      const query = elements.searchInput.value.trim();
      if (!query || !map || !geocoder) return;

      const coordinates = parseCoordinates(query);
      if (coordinates) {
        flyToLocation(coordinates);
        elements.searchInput.blur();
        showToast("指定した座標へ移動します");
        return;
      }

      setSensorStatus("場所を検索しています…", "idle");
      try {
        const response = await geocoder.geocode({ address: query, region: "JP" });
        const result = response.results?.[0];
        if (!result) throw new Error("ZERO_RESULTS");
        const position = result.geometry.location.toJSON();
        flyToLocation(position);
        elements.searchInput.value = result.formatted_address || query;
        elements.searchInput.blur();
        showToast("検索した場所へ移動します");
        setSensorStatus(gyro.active ? "ジャイロ操作中" : "ジャイロをオンにすると端末の動きでカメラを操作できます", gyro.active ? "active" : "idle");
      } catch (error) {
        console.warn("場所を検索できませんでした", error);
        showToast("場所が見つかりませんでした");
        setSensorStatus("場所名・住所または緯度,経度を入力してください", "warn");
      }
    }

    function normalizeSpot(raw, index) {
      if (!raw || typeof raw !== "object") return null;
      const lat = finiteNumber(raw.lat, NaN);
      const lng = finiteNumber(raw.lng, NaN);
      if (!Number.isFinite(lat) || !Number.isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) {
        return null;
      }

      const pano = typeof raw.pano === "string" ? raw.pano.trim() : "";
      const titleSource = raw.title || raw.name || raw.label;
      return {
        id: String(raw.id || `spot-${index + 1}`),
        title: typeof titleSource === "string" && titleSource.trim() ? titleSource.trim() : `スポット ${index + 1}`,
        lat,
        lng,
        pano,
        heading: normalize360(finiteNumber(raw.heading, 0)),
        pitch: clamp(finiteNumber(raw.pitch, 0), -90, 90),
        zoom: clamp(finiteNumber(raw.zoom, 1), 0, 5)
      };
    }

    function renderSpotMarkers(spots) {
      mapMarkers.forEach(marker => marker.remove());
      mapMarkers = [];

      spots.forEach((spot, index) => {
        const marker = new Marker3DInteractiveElementClass({
          position: { lat: spot.lat, lng: spot.lng },
          altitudeMode: "CLAMP_TO_GROUND",
          title: `${spot.title}のストリートビューを開く`,
          sizePreserved: true,
          drawsWhenOccluded: true,
          zIndex: index + 1
        });
        marker.append(new PinElementClass({
          scale: 0.62,
          background: "#9df8d3",
          borderColor: "#184a3e",
          glyphText: ""
        }));
        marker.addEventListener("gmp-click", event => {
          event.stopPropagation();
          openStreetViewSpot(spot);
        });
        map.append(marker);
        mapMarkers.push(marker);
      });
    }

    function shouldAutoFrameSpots() {
      const params = new URLSearchParams(location.search);
      if (params.has("lat") && params.has("lng")) return false;
      try {
        return !localStorage.getItem(STORAGE_KEY);
      } catch {
        return true;
      }
    }

    function distanceMeters(a, b) {
      const radius = 6371000;
      const toRadians = value => value * Math.PI / 180;
      const dLat = toRadians(b.lat - a.lat);
      const dLng = toRadians(b.lng - a.lng);
      const latA = toRadians(a.lat);
      const latB = toRadians(b.lat);
      const value = Math.sin(dLat / 2) ** 2
        + Math.cos(latA) * Math.cos(latB) * Math.sin(dLng / 2) ** 2;
      return 2 * radius * Math.asin(Math.sqrt(value));
    }

    function frameSpotMarkers(spots) {
      if (!spots.length || !map) return;
      if (!shouldAutoFrameSpots()) {
        const camera = currentCamera();
        const nearest = spots.reduce(
          (minimum, spot) => Math.min(minimum, distanceMeters(camera.center, spot)),
          Number.POSITIVE_INFINITY
        );
        if (nearest <= Math.max(camera.range * 1.4, 3000)) return;
      }
      const center = spots.reduce((sum, spot) => ({
        lat: sum.lat + spot.lat / spots.length,
        lng: sum.lng + spot.lng / spots.length
      }), { lat: 0, lng: 0 });
      const farthest = spots.reduce((max, spot) => Math.max(max, distanceMeters(center, spot)), 0);
      const range = spots.length === 1
        ? 2200
        : clamp(farthest * 2.2, 5000, 3200000);
      map.flyCameraTo({
        endCamera: {
          center: { ...center, altitude: 0 },
          range,
          heading: 0,
          tilt: spots.length === 1 ? 58 : 28,
          roll: 0
        },
        durationMillis: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 1600
      });
    }

    async function loadFirebaseSpots() {
      setSensorStatus("Firebaseからスポットを読み込んでいます…", "idle");
      try {
        const [firebaseAppModule, firestoreModule] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js")
        ]);
        const firebaseApp = firebaseAppModule.getApps().length
          ? firebaseAppModule.getApp()
          : firebaseAppModule.initializeApp(FIREBASE_CONFIG);
        const db = firestoreModule.getFirestore(firebaseApp);
        const markerSnapshot = await firestoreModule.getDoc(
          firestoreModule.doc(db, "catsmap", "markers")
        );

        const records = markerSnapshot.exists() && Array.isArray(markerSnapshot.data().items)
          ? markerSnapshot.data().items
          : [];

        const spots = records.map(normalizeSpot).filter(Boolean);
        renderSpotMarkers(spots);
        frameSpotMarkers(spots);
        if (spots.length) {
          setSensorStatus(`${spots.length}件のスポットを表示中・ピンをタップしてください`, "active");
        } else {
          setSensorStatus("Firebaseに表示できるスポットがありません", "warn");
        }
      } catch (error) {
        console.warn("Firebaseのスポットを読み込めませんでした", error);
        setSensorStatus("スポットを読み込めませんでした。3D地図はそのまま操作できます", "warn");
        showToast("Firebaseの読み取り権限または通信状態を確認してください", 3400);
      }
    }

    function delay(milliseconds) {
      return new Promise(resolve => setTimeout(resolve, milliseconds));
    }

    function cancelledTransitionError() {
      const error = new Error("transition-cancelled");
      error.cancelled = true;
      return error;
    }

    async function resolveSpotPanorama(spot) {
      const cacheKey = `${spot.pano}|${spot.lat.toFixed(6)}|${spot.lng.toFixed(6)}`;
      const cached = resolvedPanoCache.get(cacheKey);
      if (cached) return cached;

      if (spot.pano) {
        try {
          const response = await streetViewService.getPanorama({ pano: spot.pano });
          const location = response.data?.location;
          if (location?.pano) {
            const result = { pano: location.pano, fallbackUsed: false };
            resolvedPanoCache.set(cacheKey, result);
            return result;
          }
        } catch (error) {
          console.info("保存済みPano IDが無効なため位置から再検索します", error);
        }
      }

      for (const radius of [120, 500]) {
        try {
          const response = await streetViewService.getPanorama({
            location: { lat: spot.lat, lng: spot.lng },
            radius,
            preference: "nearest"
          });
          const location = response.data?.location;
          if (location?.pano) {
            const result = { pano: location.pano, fallbackUsed: true };
            resolvedPanoCache.set(cacheKey, result);
            return result;
          }
        } catch (error) {
          console.info(`${radius}m以内にストリートビューが見つかりません`, error);
        }
      }
      throw new Error("STREET_VIEW_NOT_FOUND");
    }

    function waitForPanorama(spot, resolved, token) {
      return new Promise((resolve, reject) => {
        if (token !== viewState.token || viewState.mode !== "entering") {
          reject(cancelledTransitionError());
          return;
        }
        let finished = false;
        let targetPanoSelected = panorama.getPano() === resolved.pano;
        let targetStatusReceived = targetPanoSelected && panorama.getStatus() === "OK";
        const listeners = [];
        let timeoutId;
        let graceTimer;

        const cleanup = () => {
          listeners.forEach(listener => listener.remove());
          clearTimeout(timeoutId);
          clearTimeout(graceTimer);
        };
        const fail = error => {
          if (finished) return;
          finished = true;
          cleanup();
          reject(error);
        };
        const succeed = () => {
          if (finished) return;
          if (token !== viewState.token || viewState.mode !== "entering") {
            return fail(cancelledTransitionError());
          }
          finished = true;
          cleanup();
          panorama.setPov({ heading: spot.heading, pitch: spot.pitch });
          panorama.setZoom(spot.zoom);
          graceTimer = setTimeout(() => {
            if (token !== viewState.token || viewState.mode !== "entering") {
              reject(cancelledTransitionError());
              return;
            }
            resolve(resolved);
          }, 260);
        };
        const checkStatus = fromStatusEvent => {
          if (token !== viewState.token || viewState.mode !== "entering") {
            return fail(cancelledTransitionError());
          }
          if (!targetPanoSelected || panorama.getPano() !== resolved.pano) return;
          if (fromStatusEvent) targetStatusReceived = true;
          const status = panorama.getStatus();
          if (targetStatusReceived && status === "OK") succeed();
          if (targetStatusReceived && status === "ZERO_RESULTS") fail(new Error("STREET_VIEW_NOT_FOUND"));
        };

        listeners.push(panorama.addListener("pano_changed", () => {
          if (token !== viewState.token || viewState.mode !== "entering") {
            fail(cancelledTransitionError());
            return;
          }
          targetPanoSelected = panorama.getPano() === resolved.pano;
          if (!targetPanoSelected) return;
          targetStatusReceived = false;
          setTimeout(() => {
            if (token !== viewState.token || viewState.mode !== "entering") return;
            if (panorama.getPano() !== resolved.pano) return;
            const status = panorama.getStatus();
            if (status !== "OK" && status !== "ZERO_RESULTS") return;
            targetStatusReceived = true;
            checkStatus(false);
          }, 80);
        }));
        listeners.push(panorama.addListener("status_changed", () => checkStatus(true)));
        timeoutId = setTimeout(() => fail(new Error("STREET_VIEW_TIMEOUT")), 8500);

        panorama.setMotionTracking(false);
        panorama.setVisible(true);
        google.maps.event.trigger(panorama, "resize");
        panorama.setPano(resolved.pano);
        panorama.setPov({ heading: spot.heading, pitch: spot.pitch });
        panorama.setZoom(spot.zoom);
        setTimeout(() => checkStatus(false), 120);
      });
    }

    function animateMapCamera(endCamera, durationMillis) {
      return new Promise(resolve => {
        if (!map) return resolve();
        const targetMap = map;
        let finished = false;
        let timeoutId;
        const finish = () => {
          if (finished) return;
          finished = true;
          clearTimeout(timeoutId);
          targetMap.removeEventListener("gmp-animationend", onAnimationEnd);
          resolve();
        };
        const onAnimationEnd = () => finish();
        targetMap.addEventListener("gmp-animationend", onAnimationEnd);
        targetMap.flyCameraTo({ endCamera, durationMillis });
        timeoutId = setTimeout(finish, Math.max(300, durationMillis + 1200));
        if (durationMillis === 0) setTimeout(finish, 80);
      });
    }

    function destroyOverviewMapForStreetView() {
      if (!map) return;
      const targetMap = map;
      clearTimeout(saveTimer);
      try {
        targetMap.stopCameraAnimation();
      } catch (error) {
        console.info("3D地図のアニメーションはすでに終了しています", error);
      }
      mapMarkers.forEach(marker => marker.remove());
      mapMarkers = [];
      map = null;
      targetMap.remove();
      elements.mapShell.replaceChildren();
      elements.mapShell.classList.add("is-rendering-paused");
      elements.mapShell.setAttribute("aria-hidden", "true");
      viewState.mapRenderingPaused = true;
    }

    function pauseOverviewRendering() {
      if (!map || viewState.mapRenderingPaused) return;
      map.stopCameraAnimation();
      map.removeAttribute("mode");
      viewState.mapRenderingPaused = true;
      elements.mapShell.classList.add("is-rendering-paused");
      elements.mapShell.setAttribute("aria-hidden", "true");
    }

    function waitForOverviewSteady(token, targetMap) {
      return new Promise(resolve => {
        let finished = false;
        let timeoutId;
        const finish = ready => {
          if (finished) return;
          finished = true;
          clearTimeout(timeoutId);
          targetMap.removeEventListener("gmp-steadychange", onSteadyChange);
          resolve(ready);
        };
        const onSteadyChange = event => {
          if (token !== viewState.token || viewState.mode !== "leaving" || map !== targetMap) {
            finish(false);
            return;
          }
          if (event.isSteady) finish(true);
        };

        targetMap.addEventListener("gmp-steadychange", onSteadyChange);
        timeoutId = setTimeout(() => finish(false), 5000);
      });
    }

    async function resumeOverviewRendering(token) {
      if (!map || !viewState.mapRenderingPaused) return true;
      const targetMap = map;
      const steady = waitForOverviewSteady(token, targetMap);
      targetMap.mode = OVERVIEW_MAP_MODE;
      const ready = await steady;
      if (token !== viewState.token || viewState.mode !== "leaving" || map !== targetMap) return false;
      if (!ready) {
        targetMap.removeAttribute("mode");
        return false;
      }
      viewState.mapRenderingPaused = false;
      elements.mapShell.classList.remove("is-rendering-paused");
      elements.mapShell.setAttribute("aria-hidden", "false");
      return true;
    }

    async function openStreetViewSpot(spot) {
      if (!map || !panorama || viewState.mode !== "map") return;
      const token = ++viewState.token;
      viewState.mode = "entering";
      viewState.returnCamera = currentCamera();
      viewState.resumeMapGyro = gyro.active;
      viewState.selectedSpot = spot;
      clearTimeout(saveTimer);

      if (gyro.active) stopGyro(false);
      if (orbiting) {
        orbiting = false;
        elements.orbitButton.setAttribute("aria-pressed", "false");
      }
      map.stopCameraAnimation();
      document.body.classList.add("spot-mode");
      document.body.classList.remove("street-view-ready", "street-view-settled");
      elements.streetViewTitle.textContent = spot.title;
      elements.streetViewStatus.textContent = "Pano IDを確認しながら地上へ移動しています…";
      elements.streetViewShell.classList.remove("is-active");
      elements.streetViewShell.setAttribute("aria-hidden", "true");
      await delay(70);
      if (token !== viewState.token) return;

      const duration = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 2400;
      const flight = animateMapCamera({
        center: { lat: spot.lat, lng: spot.lng, altitude: 0 },
        range: 85,
        heading: spot.heading,
        tilt: 78,
        roll: 0
      }, duration);
      const panoramaResolution = resolveSpotPanorama(spot);

      try {
        const [, resolved] = await Promise.all([flight, panoramaResolution]);
        if (token !== viewState.token || viewState.mode !== "entering") return;

        // A/B検証版では、Street Viewを描画する前に3D地図をDOMから完全に取り外す。
        destroyOverviewMapForStreetView();
        await delay(80);
        if (token !== viewState.token || viewState.mode !== "entering") return;

        await waitForPanorama(spot, resolved, token);
        if (token !== viewState.token || viewState.mode !== "entering") return;
        viewState.mode = "streetview";
        elements.streetViewStatus.textContent = resolved.fallbackUsed
          ? "Pano IDが変わったため、近くの最新画像を表示しています"
          : "端末を動かして周囲を見渡せます";
        elements.streetViewShell.setAttribute("aria-hidden", "false");
        elements.streetViewShell.classList.add("is-active");
        google.maps.event.trigger(panorama, "resize");
        panorama.setPov({ heading: spot.heading, pitch: spot.pitch });
        panorama.setZoom(spot.zoom);
        if (resolved.fallbackUsed) showToast("保存されたPano IDが変わったため、緯度経度から再検索しました", 3500);
        setTimeout(() => {
          if (token === viewState.token && viewState.mode === "streetview") {
            document.body.classList.add("street-view-ready");
            document.body.classList.add("street-view-settled");
            panorama.setMotionTracking(true);
            panorama.focus();
            setTimeout(() => {
              if (token === viewState.token && viewState.mode === "streetview" && !panorama.getMotionTracking()) {
                elements.streetViewStatus.textContent = "画面をドラッグするか、モーションボタンをタップして見渡せます";
              }
            }, 450);
          }
        }, 560);
      } catch (error) {
        if (token !== viewState.token || error.cancelled) return;
        console.warn("ストリートビューへ移動できませんでした", error);
        viewState.mode = "streetview-error";
        panorama.setMotionTracking(false);
        panorama.setVisible(false);
        elements.streetViewShell.classList.remove("is-active");
        elements.streetViewShell.setAttribute("aria-hidden", "true");
        document.body.classList.add("street-view-ready");
        document.body.classList.remove("street-view-settled");
        elements.streetViewStatus.textContent = "表示できませんでした。再読み込みしてください";
        elements.streetViewBack.textContent = "↻ 再読み込み";
        showToast("このスポットを表示できませんでした。再読み込みしてください", 4200);
      }
    }

    function closeStreetView() {
      if (panorama) panorama.setMotionTracking(false);
      location.reload();
    }

    function readOrientation(event) {
      const alpha = finiteNumber(event.alpha, NaN);
      const beta = finiteNumber(event.beta, NaN);
      const gamma = finiteNumber(event.gamma, NaN);
      if (![alpha, beta, gamma].every(Number.isFinite)) return null;

      const radians = Math.PI / 180;
      const degrees = 180 / Math.PI;
      const a = alpha * radians;
      const b = beta * radians;
      const g = gamma * radians;
      const ca = Math.cos(a);
      const sa = Math.sin(a);
      const cb = Math.cos(b);
      const sb = Math.sin(b);
      const cg = Math.cos(g);
      const sg = Math.sin(g);

      // W3Cの Z-X'-Y'' 回転から、画面の背面方向（見ている方向）を求める。
      // 端末の縦持ち／横持ちを軸の入れ替えで扱わず、物理的な向きとして扱える。
      const fx = -ca * sg - sa * sb * cg;
      const fy = -sa * sg + ca * sb * cg;
      const fz = -cb * cg;
      const horizontal = Math.hypot(fx, fy);

      return {
        heading: horizontal > 0.2 ? normalize360(Math.atan2(fx, fy) * degrees) : null,
        elevation: Math.atan2(fz, horizontal) * degrees,
        horizontal
      };
    }

    function circularMean(values) {
      if (!values.length) return null;
      let x = 0;
      let y = 0;
      values.forEach(value => {
        x += Math.cos(value * Math.PI / 180);
        y += Math.sin(value * Math.PI / 180);
      });
      return normalize360(Math.atan2(y, x) * 180 / Math.PI);
    }

    function tryFinishGyroCalibration() {
      const samples = gyro.calibrationSamples.slice(-10);
      if (samples.length < 10 || !map) return false;
      const elevation = samples.reduce((sum, sample) => sum + sample.elevation, 0) / samples.length;
      const headings = samples.map(sample => sample.heading).filter(Number.isFinite);
      const heading = circularMean(headings);
      const pitchStable = samples.every(sample => Math.abs(sample.elevation - elevation) < 3.5);
      const headingStable = heading === null || headings.every(value => Math.abs(shortestAngle(value - heading)) < 7);
      if (!pitchStable || !headingStable) {
        setSensorStatus("端末を一瞬静止してください…", "warn");
        return false;
      }

      const camera = currentCamera();
      gyro.reference = {
        sensorHeading: heading,
        sensorElevation: elevation,
        mapHeading: camera.heading,
        mapTilt: camera.tilt
      };
      gyro.targetHeading = camera.heading;
      gyro.targetTilt = camera.tilt;
      gyro.calibrationSamples = [];
      clearTimeout(gyro.waitingTimer);
      setSensorStatus(heading === null
        ? "傾きのみジャイロ操作中・端末を少し起こすと左右も反応します"
        : "ジャイロ操作中・センサー情報は端末内だけで処理します", "active");
      return true;
    }

    function handleOrientation(event) {
      if (!gyro.active) return;
      const sample = readOrientation(event);
      if (!sample) return;

      gyro.sample = sample;
      if (!gyro.reference) {
        gyro.calibrationSamples.push(sample);
        if (gyro.calibrationSamples.length > 20) gyro.calibrationSamples.shift();
        tryFinishGyroCalibration();
      }

      if (!gyro.reference) return;
      if (Number.isFinite(sample.heading) && Number.isFinite(gyro.reference.sensorHeading)) {
        const headingDelta = shortestAngle(sample.heading - gyro.reference.sensorHeading);
        gyro.targetHeading = normalize360(gyro.reference.mapHeading + headingDelta * 0.95);
      }
      const tiltDelta = sample.elevation - gyro.reference.sensorElevation;
      gyro.targetTilt = clamp(gyro.reference.mapTilt + tiltDelta * 0.75, 15, 88);
    }

    function animateGyro(time) {
      if (!gyro.active) return;
      gyro.frameId = requestAnimationFrame(animateGyro);
      if (!map || !gyro.reference || gyro.userInteracting || document.hidden) return;
      if (time - gyro.lastFrameTime < 32) return;
      gyro.lastFrameTime = time;

      const camera = currentCamera();
      const headingStep = shortestAngle(gyro.targetHeading - camera.heading) * 0.18;
      const tiltStep = (gyro.targetTilt - camera.tilt) * 0.18;
      if (Math.abs(headingStep) > 0.025) map.heading = normalize360(camera.heading + headingStep);
      if (Math.abs(tiltStep) > 0.025) map.tilt = clamp(camera.tilt + tiltStep, 15, 88);
      updateReadout();
    }

    function beginGyroCalibration(withToast = true) {
      if (!gyro.active || !map) {
        if (withToast) showToast("ジャイロをオンにしてから基準を合わせてください");
        return;
      }
      gyro.reference = null;
      gyro.calibrationSamples = [];
      setSensorStatus("現在の持ち方を基準にします。端末を一瞬静止してください…", "warn");
      if (withToast) showToast("現在の持ち方を新しい基準にします");
    }

    async function startGyro() {
      if (!("DeviceOrientationEvent" in window)) {
        setSensorStatus("この端末／ブラウザはジャイロ操作に対応していません", "error");
        showToast("ジャイロセンサーを利用できません");
        return;
      }

      if (!window.isSecureContext) {
        setSensorStatus("ジャイロはHTTPSで公開したページで利用できます", "warn");
        showToast("HTTPSのページで開いてください", 3200);
        return;
      }

      try {
        if (typeof DeviceOrientationEvent.requestPermission === "function") {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission !== "granted") throw new Error("permission-denied");
        }

        map.stopCameraAnimation();
        orbiting = false;
        elements.orbitButton.setAttribute("aria-pressed", "false");
        gyro.active = true;
        gyro.sample = null;
        gyro.reference = null;
        gyro.calibrationSamples = [];
        gyro.userInteracting = false;
        elements.gyroButton.setAttribute("aria-pressed", "true");
        elements.calibrateButton.disabled = false;
        setSensorStatus("端末を楽な位置で持ってください…", "warn");
        window.addEventListener("deviceorientation", handleOrientation, { passive: true });
        cancelAnimationFrame(gyro.frameId);
        gyro.frameId = requestAnimationFrame(animateGyro);
        clearTimeout(gyro.waitingTimer);
        gyro.waitingTimer = setTimeout(() => {
          if (gyro.active && !gyro.sample) {
            setSensorStatus("センサー信号が届きません。ブラウザの権限を確認してください", "error");
          }
        }, 2200);
      } catch (error) {
        console.warn("ジャイロを開始できませんでした", error);
        setSensorStatus("センサーの使用が許可されませんでした", "error");
        showToast("ブラウザ設定でモーションと方向へのアクセスを許可してください", 3400);
      }
    }

    function stopGyro(showMessage = true) {
      gyro.active = false;
      gyro.sample = null;
      gyro.reference = null;
      gyro.calibrationSamples = [];
      gyro.userInteracting = false;
      clearTimeout(gyro.waitingTimer);
      cancelAnimationFrame(gyro.frameId);
      window.removeEventListener("deviceorientation", handleOrientation);
      elements.gyroButton.setAttribute("aria-pressed", "false");
      elements.calibrateButton.disabled = true;
      setSensorStatus("ジャイロはオフです", "idle");
      if (showMessage) showToast("ジャイロ操作を終了しました");
    }

    async function toggleGyro() {
      if (gyro.active) stopGyro();
      else await startGyro();
    }

    function handleMapInteractionStart() {
      if (!gyro.active) return;
      gyro.userInteracting = true;
    }

    function handleMapInteractionEnd() {
      if (!gyro.active) return;
      clearTimeout(handleMapInteractionEnd.timer);
      handleMapInteractionEnd.timer = setTimeout(() => {
        gyro.userInteracting = false;
        beginGyroCalibration(false);
      }, 320);
    }

    function toggleOrbit() {
      if (!map) return;
      if (orbiting) {
        map.stopCameraAnimation();
        orbiting = false;
        elements.orbitButton.setAttribute("aria-pressed", "false");
        showToast("自動旋回を停止しました");
        return;
      }

      if (gyro.active) stopGyro(false);
      orbiting = true;
      elements.orbitButton.setAttribute("aria-pressed", "true");
      setSensorStatus("ゆっくり自動旋回しています", "active");
      const camera = currentCamera();
      map.flyCameraAround({
        camera: {
          center: camera.center,
          range: camera.range,
          tilt: Math.max(55, camera.tilt),
          heading: camera.heading,
          roll: 0
        },
        durationMillis: 24000,
        repeatCount: 1
      });
    }

    function locateUser() {
      if (!navigator.geolocation) {
        showToast("現在地を取得できないブラウザです");
        return;
      }
      setSensorStatus("現在地を確認しています…", "idle");
      navigator.geolocation.getCurrentPosition(
        position => {
          flyToLocation({ lat: position.coords.latitude, lng: position.coords.longitude }, 1800);
          setSensorStatus(gyro.active ? "ジャイロ操作中" : "現在地へ移動しました", gyro.active ? "active" : "idle");
        },
        error => {
          console.warn("現在地を取得できませんでした", error);
          setSensorStatus("現在地の使用が許可されていません", "warn");
          showToast("ブラウザ設定で位置情報を許可してください");
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
      );
    }

    function cameraShareUrl() {
      const camera = currentCamera();
      const url = new URL(location.href);
      url.search = "";
      url.searchParams.set("lat", camera.center.lat.toFixed(6));
      url.searchParams.set("lng", camera.center.lng.toFixed(6));
      url.searchParams.set("alt", Math.round(camera.center.altitude));
      url.searchParams.set("range", Math.round(camera.range));
      url.searchParams.set("heading", camera.heading.toFixed(1));
      url.searchParams.set("tilt", camera.tilt.toFixed(1));
      return url.href;
    }

    async function copyCameraLink() {
      const url = cameraShareUrl();
      try {
        await navigator.clipboard.writeText(url);
        showToast("現在のカメラ位置のリンクをコピーしました");
      } catch (error) {
        console.warn("リンクをコピーできませんでした", error);
        window.prompt("現在のカメラ位置のリンク", url);
      }
    }

    function setCleanMode(enabled) {
      document.body.classList.toggle("clean-mode", enabled);
      elements.cleanButton.setAttribute("aria-pressed", String(enabled));
      if (enabled) showToast("収録モード：右上の×で操作画面に戻ります", 1800);
    }

    async function toggleFullscreen() {
      const app = document.getElementById("app");
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else if (app.requestFullscreen) {
          await app.requestFullscreen();
        } else {
          showToast("ブラウザの共有／メニューから全画面表示を選んでください", 3200);
        }
      } catch (error) {
        console.warn("全画面表示を切り替えられませんでした", error);
        showToast("このブラウザでは全画面表示を開始できませんでした");
      }
    }

    function bindUi() {
      elements.searchForm.addEventListener("submit", searchLocation);
      elements.streetViewBack.addEventListener("click", closeStreetView);
      elements.locateButton.addEventListener("click", locateUser);
      elements.shareButton.addEventListener("click", copyCameraLink);
      elements.cleanButton.addEventListener("click", () => setCleanMode(true));
      elements.cleanExit.addEventListener("click", () => setCleanMode(false));
      elements.fullscreenButton.addEventListener("click", toggleFullscreen);

      document.addEventListener("fullscreenchange", () => {
        elements.fullscreenButton.setAttribute("aria-pressed", String(Boolean(document.fullscreenElement)));
        if (panorama && viewState.mode === "streetview") {
          setTimeout(() => google.maps.event.trigger(panorama, "resize"), 120);
        }
      });

      window.addEventListener("orientationchange", () => {
        if (panorama && viewState.mode === "streetview") {
          setTimeout(() => google.maps.event.trigger(panorama, "resize"), 180);
        }
      });
    }

    async function init() {
      bindUi();
      setSensorStatus("3D地図を読み込んでいます…", "idle");
      const [maps3dLibrary, { Geocoder }, streetViewLibrary, { PinElement }] = await Promise.all([
        google.maps.importLibrary("maps3d"),
        google.maps.importLibrary("geocoding"),
        google.maps.importLibrary("streetView"),
        google.maps.importLibrary("marker")
      ]);
      const { Map3DElement, Marker3DInteractiveElement } = maps3dLibrary;
      const { StreetViewPanorama, StreetViewService } = streetViewLibrary;
      Marker3DInteractiveElementClass = Marker3DInteractiveElement;
      PinElementClass = PinElement;

      const initial = cameraFromUrlOrStorage();
      map = new Map3DElement({
        center: initial.center,
        range: initial.range,
        heading: initial.heading,
        tilt: initial.tilt,
        roll: 0,
        mode: OVERVIEW_MAP_MODE,
        gestureHandling: "GREEDY",
        defaultUIHidden: true,
        minTilt: 0,
        maxTilt: 90
      });
      map.description = "Google Earth風の3Dスポットカメラ";
      elements.mapShell.append(map);
      geocoder = new Geocoder();
      streetViewService = new StreetViewService();
      panorama = new StreetViewPanorama(elements.streetView, {
        visible: false,
        pov: { heading: 0, pitch: 0 },
        zoom: 1,
        addressControl: false,
        fullscreenControl: false,
        enableCloseButton: false,
        panControl: false,
        zoomControl: true,
        linksControl: true,
        clickToGo: true,
        scrollwheel: true,
        motionTracking: true,
        motionTrackingControl: true,
        showRoadLabels: true
      });

      map.addEventListener("gmp-error", () => {
        showMapError("Google Cloudで Maps JavaScript API と課金が有効か、APIキーのウェブサイト制限が正しいか確認してください。");
      });
      map.addEventListener("gmp-headingchange", updateReadout);
      map.addEventListener("gmp-rangechange", updateReadout);
      map.addEventListener("gmp-steadychange", event => {
        if (event.isSteady) {
          updateReadout();
          scheduleSaveCamera();
        }
      });
      map.addEventListener("gmp-animationend", () => {
        if (orbiting) {
          orbiting = false;
          elements.orbitButton.setAttribute("aria-pressed", "false");
          setSensorStatus("自動旋回が完了しました", "idle");
        }
        updateReadout();
        scheduleSaveCamera();
      });

      updateReadout();
      setSensorStatus("Firebaseからスポットを読み込んでいます…", "idle");
      void loadFirebaseSpots();
    }

    (bootstrap => {
      let promise;
      let script;
      let key;
      const product = "The Google Maps JavaScript API";
      const namespace = "google";
      const importName = "importLibrary";
      const callbackName = "__ib__";
      const documentRef = document;
      const windowRef = window;
      const googleRef = windowRef[namespace] || (windowRef[namespace] = {});
      const mapsRef = googleRef.maps || (googleRef.maps = {});
      const libraries = new Set();
      const params = new URLSearchParams();
      const load = () => promise || (promise = new Promise(async (resolve, reject) => {
        script = await documentRef.createElement("script");
        params.set("libraries", [...libraries] + "");
        for (key in bootstrap) {
          params.set(key.replace(/[A-Z]/g, letter => `_${letter[0].toLowerCase()}`), bootstrap[key]);
        }
        params.set("callback", `${namespace}.maps.${callbackName}`);
        script.src = `https://maps.${namespace}apis.com/maps/api/js?${params}`;
        mapsRef[callbackName] = resolve;
        script.onerror = () => reject(new Error(`${product} could not load.`));
        script.nonce = documentRef.querySelector("script[nonce]")?.nonce || "";
        documentRef.head.append(script);
      }));
      mapsRef[importName]
        ? console.warn(`${product} only loads once. Ignoring:`, bootstrap)
        : mapsRef[importName] = (library, ...args) => libraries.add(library) && load().then(() => mapsRef[importName](library, ...args));
    })({ key: API_KEY, v: "weekly", language: "ja", region: "JP" });

    init().catch(error => {
      console.error(error);
      showMapError("通信状態とAPIキーの設定を確認してください。ジャイロ操作にはHTTPSでの公開が必要です。");
    });
  </script>
</body>
</html>
